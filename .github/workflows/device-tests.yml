# Integration tests against the real MTP device, on the shared self-hosted
# runners in the MeltzgSoft org. ci.yml stays on GitHub-hosted runners and only
# compiles the integration sources (integrationTestClasses); this is the half
# that actually talks to hardware.
#
# ⚠ THIS REPOSITORY IS PUBLIC, which is why there is no pull_request trigger.
# Anyone can fork a public repo, and pull_request would run their workflow file
# on a runner that has a physical device attached and is shared with private
# repositories -- with only a maintainer's Approve click in the way. Post-merge
# gives a public repo the property a private one gets from having fork PR
# workflows disabled: code reaches the device after review, not before.
#
# Do not copy the trigger list out of MeltzgSoft/usb-ci. That repo does use
# pull_request, but only because it is private AND the org has fork PR
# workflows disabled for private repositories. Neither holds here.
#
# Everything except the triggers comes from the shared reusable workflow in
# usb-ci: the environment gate, the concurrency group, and acquire/release
# against the lock service. That is deliberate -- the trigger list is the one
# thing that must differ between a private repo and a public one, and the lock
# handling is the thing that must not drift between them.
#
# Prerequisites, one-time:
#   org  - repo in the `device-runners` runner group, and in the selected
#          repositories for the LOCKSERVICE_URL organization variable
#   repo - Settings > Environments > device-tests with required reviewers and
#          deployment branches restricted to master. Both are already set.
name: Device Tests

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  linux:
    uses: MeltzgSoft/usb-ci/.github/workflows/device-job.yml@main
    with:
      target: linux
      runner-labels: '["self-hosted", "linux"]'
      # -PrequireDevice turns an all-skipped run into a build failure
      # (build.gradle.kts). Without it these tests self-skip when no device is
      # present, and an all-skipped run is indistinguishable from a passing
      # one -- a green build that tested nothing.
      run: ./gradlew integrationTest -PrequireDevice

  windows:
    uses: MeltzgSoft/usb-ci/.github/workflows/device-job.yml@main
    with:
      target: windows
      runner-labels: '["self-hosted", "windows"]'
      # `browse` first: every successful WPD interaction so far has been in an
      # interactive desktop session, while the runner executes as a service in
      # session 0, and MTP enumeration through WPD has a history of differing
      # between the two. WpdCom uses COINIT_MULTITHREADED, which avoids the STA
      # message-pump problems that usually break COM in a service, so this will
      # probably work -- but it is untested. If MTPBrowser prints "No MTP
      # devices connected." while the lock is held, run this runner
      # interactively (autologon plus a startup task) instead of as a service.
      run: .\gradlew.bat browse --args="1"; .\gradlew.bat integrationTest -PrequireDevice
