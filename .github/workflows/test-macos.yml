name: macOS tests

# The GitHub-hosted macOS release-gate leg. Everyday pull-request and post-
# merge coverage now runs on the native Forgejo runner from the test-macos job
# in .forgejo/workflows/ci.yml; this callable workflow remains here so release
# tags keep their proven hosted environment and publication credentials.
on:
  workflow_call:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      # libmtp is the native backend on macOS and NativeLibMTPLoadTest fails
      # without it.
      - name: Install libmtp
        run: brew install libmtp
      - name: Run unit tests and compile integration tests
        run: ./gradlew test integrationTestClasses
