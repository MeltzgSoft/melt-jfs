name: macOS

# Runs the macOS leg on every commit that reaches master -- after the forge
# migration, that means every mirror sync.
#
# Previously macOS ran only as release.yml's gate, so a macOS regression
# surfaced when a tag was cut, with the release already in motion. The forge
# covers linux and Windows on its own runners; macOS is the one leg nothing
# else would catch (usb-ci FR-10.17), which makes it the worst one to defer.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-macos:
    uses: ./.github/workflows/test-macos.yml
