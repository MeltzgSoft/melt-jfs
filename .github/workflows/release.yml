name: Release

# Publishes io.github.meltzg:melt-jfs to Maven Central whenever a semantic-version tag (vMAJOR.MINOR.PATCH)
# is pushed. The tag's version (minus the leading "v") becomes the published artifact version.
#
# Post-migration (usb-ci FR-2.7/FR-10.4), this repo is a read-only push mirror of the forge and this
# workflow is the only CI left on GitHub. Tags arrive via the mirror, and two jobs gate the publish:
#
#   - hardware-gate: the forge runs the real-device integration tests and posts the outcome for each
#     master SHA as the commit status `forge/device-tests` (FR-10.9). No status, or a failed one,
#     blocks the release -- fail closed (FR-10.10), keyed to the exact commit being released
#     (FR-10.11), never to recency.
#   - test-macos: the hosted release-gate repeat of the tier-1 macOS leg
#     (fake-backed tests + integration-test compilation). Pull-request and
#     post-merge coverage runs on the native Forgejo runner.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # The gate override (FR-10.12): with the lab down, dispatch this workflow from the tag's ref with
  # override_hardware_gate=true and a reason. The dispatch inputs in the run log are the trace --
  # bypassing must be deliberate and recorded, never "disable the check and forget".
  workflow_dispatch:
    inputs:
      override_hardware_gate:
        description: "Skip the forge/device-tests status gate (lab outage only)"
        type: boolean
        default: false
      reason:
        description: "Why the gate is being overridden (recorded in this run's log)"
        required: false
        default: ""

jobs:
  hardware-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require the forge/device-tests status on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.override_hardware_gate }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "${OVERRIDE:-false}" = "true" ]; then
            echo "::warning::hardware gate OVERRIDDEN (FR-10.12). Reason: ${REASON:-none given}"
            exit 0
          fi
          # Resolve the tag to its commit through the API rather than trusting GITHUB_SHA: for
          # annotated tags GITHUB_SHA can be the tag object, and statuses live on commits.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)

          # WAIT for a verdict rather than demanding one already exists. A tag
          # reaches GitHub within seconds of being pushed, but the forge is still
          # running that commit's device tests -- minutes, behind a capacity-1
          # runner and the device lock. Asking once loses that race whenever a tag
          # closely follows a merge, which is the normal way to cut a release, and
          # it did: dapr v0.1.2's gate failed 5s in, then the status landed ~90s
          # later and the identical commit passed.
          #
          # Fail-closed is unchanged (FR-10.10): no verdict inside the window is
          # still a failure. Only "not yet" waits; a real FAILURE exits
          # immediately, because a failed hardware run will not become a passing
          # one by waiting.
          for attempt in $(seq 1 20); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "forge/device-tests")][0].state // "missing"')
            case "$state" in
              success)
                echo "forge/device-tests on $sha: success"
                exit 0
                ;;
              failure|error)
                echo "::error::the released commit FAILED its hardware run ($state). Fix it and tag" \
                  "again, or -- lab outage only -- re-run via workflow_dispatch with" \
                  "override_hardware_gate=true and a reason." >&2
                exit 1
                ;;
              *)
                echo "attempt $attempt/20: forge/device-tests on $sha is '$state'; waiting 30s"
                ;;
            esac
            sleep 30
          done
          echo "::error::no forge/device-tests verdict for $sha after 10 minutes. The forge posts it" \
            "for every master push; check the run there, or -- lab outage only -- re-run via" \
            "workflow_dispatch with override_hardware_gate=true and a reason." >&2
          exit 1

  # The native Forgejo runner has normally passed equivalent tier-1 coverage
  # on this commit already. This hosted repeat keeps the release gate in the
  # same environment that performs publication.
  test-macos:
    uses: ./.github/workflows/test-macos.yml

  publish:
    needs: [hardware-gate, test-macos]
    runs-on: ubuntu-latest

    steps:
      # workflow_dispatch can be pointed at any ref; everything below assumes a v#.#.# tag, so anything
      # else is an operator mistake worth stopping loudly.
      - name: Require a semantic-version tag ref
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::run this from a v#.#.# tag ref, not '$GITHUB_REF_NAME'"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      # Derive the artifact version from the tag: refs/tags/v1.2.3 -> 1.2.3
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          # Central Portal user token (Account -> Generate User Token on central.sonatype.com).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # ASCII-armored GPG private key and its passphrase, used to sign every artifact.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # A mirrored tag creates only a TAG here, never a Release (usb-ci FR-10.3) --
  # something must actively create the release object, and this is it. After
  # publish, deliberately: the Release means "shipped", so it must not exist
  # for a version Maven Central rejected. Notes-only: Central is the artifact
  # home, and a jar attached here would be a second distribution channel to
  # drift. No retrigger loop: creating a Release on an existing tag fires a
  # `release` event, not a tag push, and this workflow listens only for tag
  # pushes and dispatch -- plus GITHUB_TOKEN-initiated events never trigger
  # workflows at all.
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent so a workflow_dispatch re-run (the FR-10.12 gate
        # override path) doesn't fail on a Release it already made.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
