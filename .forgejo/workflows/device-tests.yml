name: Device Tests

# Tier 2 (usb-ci FR-4.5): integration tests against the real MTP device, on
# the device runners inside the VMs. pull_request is safe here in a way it
# was not on GitHub: the forge is single-user with registration closed
# (NFR-4), so there are no fork PRs and a PR can only run operator-authored
# code -- and FR-4.4 wants hardware tests on PRs, since catching an MTP
# regression before merge is the reason the lab exists.
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

# One device, so one run at a time. cancel-in-progress stays false: superseded
# PENDING runs die before touching hardware (the safe half of auto-cancel,
# FR-4.8), but cancelling in flight can orphan the lease until its TTL
# expires even though release is if: always().
concurrency:
  group: device-tests
  cancel-in-progress: false

jobs:
  # runs-on vocabulary (FR-4.2, FR-9.9/9.10): windows-usb/linux-usb select
  # the executor that can receive the controller -- never the bare platform
  # label -- and device-mtp is the capability label, because melt-jfs tests
  # whatever MTP device is attached without caring which. The SAME label goes
  # to --device-label, one vocabulary for dispatch and acquire: labels route
  # the job, the lease check is what keeps it off the wrong hardware.
  windows:
    runs-on: [windows-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # TS 6.1 step 0: the service serves its own client, so this job always
      # runs the client that matches the deployed service. No copy lives in
      # this repo, deliberately -- copies drift with the service API.
      - name: Fetch the lock client
        run: Invoke-WebRequest "$env:LOCKSERVICE_URL/client/devicelock.py" -OutFile devicelock.py

      - name: Acquire device lock
        run: python devicelock.py acquire --target windows --device-label device-mtp

      # FR-9.8: confirm the guest actually enumerates the vendor:product the
      # catalog declares for the attached type. The only check that catches
      # a hardware swap nobody re-declared.
      - name: Verify the attached device
        run: python devicelock.py verify

      # TEMPORARILY DISABLED (PR #25). With the FiiO M11 Plus attached the suite
      # hangs on this runner rather than failing -- last seen passing
      # uploadedId3v23Mp3TagsAreReadBackViaAudioView on FiiO / Internal shared
      # storage and never reaching the next test. A hang burns the whole job
      # timeout and leaves the probes below unreachable, and the probes are what
      # this branch still needs. Restore this step (drop the if:) once the hang
      # is understood -- do NOT merge with it disabled.
      #
      # -PrequireDevice: the integration tests self-skip without a device,
      # and after a successful acquire + verify an all-skipped run is a
      # failure, not a pass.
      - name: Run integration tests
        if: ${{ false }}
        run: .\gradlew.bat integrationTest -PrequireDevice

      # TEMPORARY (PR #25): measures what the driver does when a name is already
      # taken, to settle whether a FileAlreadyExistsException backstop can key off
      # the HRESULT. libmtp has now answered on all four storages (refused
      # everywhere, no duplicate); this is the WPD half. Remove once
      # docs/windows-parity.md records the answer.
      - name: Probe name collisions
        if: always()
        timeout-minutes: 10
        run: .\gradlew.bat collisionProbe

      # TEMPORARY (PR #25): the real test of the WPD parity gap, not a smoke test.
      # Targeted at FiiO / Micro SD alone, the only storage known to reserve a
      # deleted name: no other storage can score a lever, so pointing the raw
      # opcodes at them would add wedge risk for no data. No "force" either --
      # with a genuine reservation available, an unscored result is not wanted.
      #
      # Lever order is deliberate: recycle (the known-negative control, proving
      # the reservation is live), then session (CloseSession+OpenSession, the
      # direct test of "reset the session the DEVICE sees"), then reset
      # (ResetDevice, the bigger hammer, last because it is likeliest to end the
      # run). Each lever re-establishes its own reservation, so a wedge degrades
      # to a skipped lever rather than a bogus result.
      #
      # These go underneath a driver that thinks it owns the session and CAN
      # wedge WpdMtpDr, whose recorded recovery is a physical replug. Run
      # deliberately, with access to the machine. timeout-minutes bounds it
      # because a wedged Open blocks forever with no timeout of its own.
      - name: Run the reservation lever probe
        if: always()
        timeout-minutes: 15
        run: .\gradlew.bat reservationLeverProbe "--args=FiiO M11 Plus|M11 Plus Micro SD;recycle,session,reset"

      - name: Release device lock
        if: always()
        run: python devicelock.py release

  linux:
    runs-on: [linux-usb, device-mtp]
    env:
      LOCKSERVICE_URL: ${{ vars.LOCKSERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Fetch the lock client
        run: curl -fsS "$LOCKSERVICE_URL/client/devicelock.py" -o devicelock.py

      # python3, not python: Ubuntu ships no `python` alias (recorded scar
      # from the GitHub-runner era of usb-ci's device-tests.yml).
      - name: Acquire device lock
        run: python3 devicelock.py acquire --target linux --device-label device-mtp

      - name: Verify the attached device
        run: python3 devicelock.py verify

      # Host mode: libmtp9 and usbutils (lsusb, for verify above) are guest
      # images' responsibility, installed once at runner bring-up -- a job
      # must not apt-get inside the VM it shares with every other job.
      - name: Run integration tests
        run: ./gradlew integrationTest -PrequireDevice

      # TEMPORARY (PR #25): the libmtp half of the same measurement — the doc's
      # claim is that the two backends differ here, so the comparison needs both.
      - name: Probe name collisions
        if: always()
        run: ./gradlew collisionProbe

      # TEMPORARY (PR #25): the libmtp half of the same smoke test. Equally UNSCORED
      # here -- no attached storage reserves names -- but it exercises the harness on
      # the backend where a reopen is the mitigation that already works.
      - name: Smoke-test the reservation lever probe
        if: always()
        run: ./gradlew reservationLeverProbe "--args=;recycle,force"

      - name: Release device lock
        if: always()
        run: python3 devicelock.py release

  # The release gate's forge half (FR-10.9-10.12, TS 6.3): publish the
  # hardware outcome to the GitHub mirror as a commit status for this SHA;
  # release.yml over there requires it before publishing. Push runs only --
  # PR-branch SHAs need not exist on the mirror, and releases tag master
  # commits. Runs on the general runner: it needs api.github.com, not
  # hardware. Fail closed cuts both ways (FR-10.10): a status that cannot be
  # posted fails THIS job loudly, because a status that silently never lands
  # is a release that silently never unblocks.
  report:
    if: always() && github.event_name == 'push'
    needs: [windows, linux]
    runs-on: linux
    env:
      WINDOWS_RESULT: ${{ needs.windows.result }}
      LINUX_RESULT: ${{ needs.linux.result }}
      # Fine-grained PAT, commit statuses R/W on the mirror, stored as a
      # forge Actions secret -- distinct from the mirror credential (FR-2.4).
      STATUS_TOKEN: ${{ secrets.MIRROR_STATUS_TOKEN }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
    steps:
      - name: Post the hardware outcome to the GitHub mirror
        run: |
          set -euo pipefail
          if [ -z "$STATUS_TOKEN" ]; then
            echo "MIRROR_STATUS_TOKEN is not set; cannot post the hardware status." >&2
            echo "Releases stay blocked until it is (FR-10.10, fail closed)." >&2
            exit 1
          fi
          state=failure
          [ "$WINDOWS_RESULT" = success ] && [ "$LINUX_RESULT" = success ] && state=success
          # The mirror syncs on commit, but this post can still race the
          # SHA's arrival on GitHub (TS 6.3) -- retry, don't fail on the
          # first "No commit found".
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $STATUS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"forge/device-tests\",\"description\":\"windows: $WINDOWS_RESULT, linux: $LINUX_RESULT\",\"target_url\":\"$TARGET_URL\"}")
            if [ "$code" = 201 ]; then
              echo "posted $state for $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $attempt/10: HTTP $code"
            cat resp.json || true
            sleep 15
          done
          echo "never posted the status; the release gate stays closed (FR-10.10)" >&2
          exit 1
